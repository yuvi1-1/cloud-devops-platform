{{- if eq .Values.cluster.provider "eks" }}
# AWS Secrets Manager as the source of truth for application secrets. The
# operator authenticates with EKS Pod Identity (no credentials in this spec).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.cluster.region }}
  conditions:
    - namespaces:
        {{- toYaml .Values.appNamespaces | nindent 8 }}
{{- end }}
