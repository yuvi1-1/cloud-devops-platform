# Alerting rules for the API (RED method). The same expressions are rendered as a
# PrometheusRule by the Helm chart for kube-prometheus-stack in the cluster.
groups:
  - name: cloud-devops-api
    rules:
      - alert: CloudDevopsApiDown
        expr: up{service=~".*-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape the API for more than 2 minutes."

      - alert: CloudDevopsApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{app="cloud-devops-api",status_code=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{app="cloud-devops-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx ratio above 5%"
          description: "More than 5% of API requests are failing (current {{ $value | humanizePercentage }})."

      - alert: CloudDevopsApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{app="cloud-devops-api"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 500ms"
          description: "p95 latency is {{ $value | humanizeDuration }} over the last 10 minutes."

      - alert: CloudDevopsProdDeploymentFailures
        expr: sum(increase(deployments_recorded_total{environment="prod",status=~"failed|rolled_back"}[1h])) > 2
        labels:
          severity: warning
        annotations:
          summary: "Multiple failed production deployments in the last hour"
          description: "Change failure rate is degrading — consider pausing releases."
