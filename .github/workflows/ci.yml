# ─────────────────────────────────────────────────────────────────────────────
# CI: test → validate → scan → build, sign & attest images → e2e on kind →
# (main only) bump the dev environment in Git so Argo CD deploys it.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "gitops/environments/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION_FILE: .nvmrc

jobs:
  # ── 1. Application: lint, type-check, unit + integration tests, build ─────
  app:
    name: App · test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test (unit + PostgreSQL integration)
        run: |
          npm run test:coverage -w apps/api
          npm run test -w apps/web
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  # ── 2. Kubernetes manifests: helm lint + schema + kubeconform + kube-linter ─
  manifests:
    name: Helm & GitOps manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Install kubeconform & kube-linter
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          curl -sSL https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz | tar xz -C "$HOME/bin" kube-linter
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Validate all charts and value combinations
        run: ./scripts/validate-manifests.sh

  # ── 3. Infrastructure as Code ─────────────────────────────────────────────
  terraform:
    name: Terraform · fmt, validate, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked providers — no AWS credentials needed)
        run: terraform test
      - name: Validate state bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init && tflint --format compact

  # ── 4. Security: IaC misconfig, secrets, dependency CVEs, workflow lint ───
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy — vulnerabilities, secrets & IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-repo.sarif
          trivyignores: .trivyignore
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-repo.sarif') != ''
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
      - name: Trivy — fail on critical issues
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: Dependency review
        if: github.event_name == 'pull_request'
        # Needs the dependency graph (Settings → Security → Dependency graph).
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ── 5. Container images: build (multi-arch), scan, sign, attest ───────────
  images:
    name: Image · ${{ matrix.component }}
    needs: [app]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Sigstore) + provenance attestations
      attestations: write
      security-events: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (registries require lowercase)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build${{ env.PUSH == 'true' && ' & push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # SBOM + SLSA provenance attached to the image by BuildKit
          sbom: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
      - name: Image reference to scan
        id: ref
        run: |
          if [[ "$PUSH" == "true" ]]; then
            echo "ref=${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ steps.name.outputs.image }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy — image vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}
      - name: Trivy — gate on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: .trivyignore
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      - name: Sign image (keyless, GitHub OIDC → Fulcio, logged in Rekor)
        if: env.PUSH == 'true'
        run: cosign sign --yes "${{ steps.ref.outputs.ref }}"
      - name: Attest build provenance (GitHub artifact attestations)
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── 6. End-to-end on a real Kubernetes cluster (kind) ─────────────────────
  e2e:
    name: E2E · kind cluster
    needs: [app]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        run: |
          for c in api web; do
            docker buildx build --load -f "apps/$c/Dockerfile" -t "cloud-devops/$c:e2e" \
              --build-arg APP_VERSION=e2e --build-arg GIT_COMMIT="$GITHUB_SHA" .
          done
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: e2e
          version: v0.33.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Load images into kind
        run: kind load docker-image cloud-devops/api:e2e cloud-devops/web:e2e --name e2e
      - name: Run end-to-end tests
        run: IMAGE_TAG=e2e ./scripts/e2e.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,netpol,pvc -n e2e -o wide || true
          kubectl logs -n e2e -l app.kubernetes.io/component=api --tail=100 --all-containers || true

  # ── 7. Continuous delivery to DEV via GitOps (main only) ──────────────────
  deploy-dev:
    name: Deploy · dev (GitOps)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [images, e2e, manifests, terraform, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Point dev at ${{ github.sha }}
        run: |
          yq -i '.global.imageTag = strenv(GITHUB_SHA)' gitops/environments/dev/values.yaml
          git diff --stat
      - name: Commit & push (Argo CD syncs the change)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/dev/values.yaml
          git diff --cached --quiet && { echo "already up to date"; exit 0; }
          git commit -m "chore(dev): deploy ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1

  record-dev:
    name: Track · dev deployment
    needs: [deploy-dev]
    uses: ./.github/workflows/record-deployment.yml
    with:
      environment: dev
      tag: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
