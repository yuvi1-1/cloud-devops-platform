global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: cloud-devops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: cloud-devops-api
          namespace: compose
