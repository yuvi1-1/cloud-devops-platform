# Local 3-node cluster. kindnet (kind >= 0.24) enforces NetworkPolicies, so the
# chart's default-deny policies behave like on EKS with the VPC CNI.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloud-devops
nodes:
  - role: control-plane
    # Envoy Gateway's NodePorts → http://*.localtest.me on the host.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
