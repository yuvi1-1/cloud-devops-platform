{{- if and .Values.api.enabled .Values.api.rollout.enabled .Values.api.rollout.analysis.enabled }}
{{- $a := .Values.api.rollout.analysis }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "cloud-devops.api.fullname" . }}-canary-health
  labels:
    {{- include "cloud-devops.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    # Share of canary requests that did not fail with a 5xx.
    - name: success-rate
      interval: {{ $a.interval }}
      failureLimit: {{ $a.failureLimit }}
      # No traffic yet → NaN/empty result counts as success.
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] >= {{ $a.successRate }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: |
            sum(rate(http_requests_total{app="cloud-devops-api",namespace="{{ .Release.Namespace }}",rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}",status_code!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{app="cloud-devops-api",namespace="{{ .Release.Namespace }}",rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[2m]))
    # p95 latency of the canary.
    - name: p95-latency
      interval: {{ $a.interval }}
      failureLimit: {{ $a.failureLimit }}
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= {{ $a.maxP95LatencySeconds }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app="cloud-devops-api",namespace="{{ .Release.Namespace }}",rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[2m])))
{{- end }}
