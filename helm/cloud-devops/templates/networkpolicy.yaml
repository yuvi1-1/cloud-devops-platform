{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
# 1) Zero-trust baseline: every pod of this release denies all traffic by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-devops.fullname" . }}-default-deny
  labels:
    {{- include "cloud-devops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "cloud-devops.name" . }}
    matchExpressions:
      # `helm test` pods need egress to reach the services they probe.
      - { key: app.kubernetes.io/component, operator: NotIn, values: [test] }
  policyTypes: [Ingress, Egress]
{{- if .Values.web.enabled }}
---
# 2) Web: only the ingress controller may connect; egress limited to DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-devops.web.fullname" . }}
  labels:
    {{- include "cloud-devops.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-devops.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              cloud-devops.io/client: "true"
      ports:
        - port: http
  egress:
    - {{- toYaml $dns | nindent 6 }}
{{- end }}
{{- if .Values.api.enabled }}
---
# 3) API: ingress controller + Prometheus (metrics) in; DNS + PostgreSQL out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-devops.api.fullname" . }}
  labels:
    {{- include "cloud-devops.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-devops.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
        - podSelector:
            matchLabels:
              cloud-devops.io/client: "true"
      ports:
        - port: http
  egress:
    - {{- toYaml $dns | nindent 6 }}
    {{- if eq .Values.database.mode "internal" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "cloud-devops.selectorLabels" (dict "root" . "component" "postgresql") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- else if eq .Values.database.mode "external" }}
    - {{- if $np.databaseEgressCIDRs }}
      to:
        {{- range $np.databaseEgressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.database.external.port }} }
    {{- end }}
{{- end }}
{{- if eq .Values.database.mode "internal" }}
---
# 4) PostgreSQL: reachable only from API pods; no egress except DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-devops.postgresql.fullname" . }}
  labels:
    {{- include "cloud-devops.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-devops.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cloud-devops.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
  egress:
    - {{- toYaml $dns | nindent 6 }}
{{- end }}
{{- end }}
