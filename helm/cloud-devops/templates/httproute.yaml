{{- if .Values.gateway.enabled }}
{{- range $component := list "web" "api" }}
{{- $v := index $.Values $component }}
{{- if $v.enabled }}
{{- $svc := printf "%s-%s" (include "cloud-devops.fullname" $ | trunc 59) $component }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $svc }}
  labels:
    {{- include "cloud-devops.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $.Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml $.Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ eq $component "api" | ternary "/api" "/" }}
      {{- if eq $component "web" }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      {{- end }}
      backendRefs:
        - name: {{ $svc }}
          port: {{ $.Values.service.port }}
          {{- if and (eq $component "api") $.Values.api.rollout.enabled }}
          weight: 100
        # Argo Rollouts moves weight between these two backends during a canary.
        - name: {{ $svc }}-canary
          port: {{ $.Values.service.port }}
          weight: 0
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
