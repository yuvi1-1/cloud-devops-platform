{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloud-devops.serviceAccountName" . }}
  labels:
    {{- include "cloud-devops.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Workloads never talk to the Kubernetes API: don't mount a token.
automountServiceAccountToken: false
{{- end }}
