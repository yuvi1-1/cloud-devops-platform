{{- if eq .Values.database.mode "internal" }}
{{- $c := dict "root" . "component" "postgresql" }}
{{- $pg := .Values.database.internal }}
# Single-replica PostgreSQL for dev/demo environments. Production uses
# database.mode=external (Amazon RDS, Multi-AZ, automated backups).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-devops.postgresql.fullname" . }}
  labels:
    {{- include "cloud-devops.componentLabels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cloud-devops.selectorLabels" $c | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cloud-devops.postgresql.fullname" . }}
  labels:
    {{- include "cloud-devops.componentLabels" $c | nindent 4 }}
spec:
  serviceName: {{ include "cloud-devops.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cloud-devops.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloud-devops.selectorLabels" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cloud-devops.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        # UID/GID of the postgres user in the official alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloud-devops.dbSecretName" . }}
                  key: {{ .Values.database.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage.size }}
{{- end }}
