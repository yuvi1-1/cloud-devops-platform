{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.databaseKey }}
# Database credentials synced from AWS Secrets Manager (e.g. the RDS-managed master secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cloud-devops.dbSecretName" . }}
  labels:
    {{- include "cloud-devops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "cloud-devops.dbSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.database.passwordKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.databaseKey }}
        property: password
{{- end }}
{{- if .Values.externalSecrets.ingestTokenKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cloud-devops.ingestSecretName" . }}
  labels:
    {{- include "cloud-devops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "cloud-devops.ingestSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.api.ingestToken.key }}
      remoteRef:
        key: {{ .Values.externalSecrets.ingestTokenKey }}
{{- end }}
{{- end }}
