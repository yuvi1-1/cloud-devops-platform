{{- /*
  Secrets created by the chart only when no existing / external secret is used.
  Values are deliberately NOT randomly generated: random values would change on
  every `helm template` (Argo CD) render and break the database. Use
  existingSecret or externalSecrets for anything beyond local/dev.
*/ -}}
{{- if and .Values.api.ingestToken.value (not .Values.api.ingestToken.existingSecret) (not (and .Values.externalSecrets.enabled .Values.externalSecrets.ingestTokenKey)) }}
{{- if lt (len .Values.api.ingestToken.value) 16 }}
{{- fail "api.ingestToken.value must be at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloud-devops.ingestSecretName" . }}
  labels:
    {{- include "cloud-devops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.ingestToken.key }}: {{ .Values.api.ingestToken.value | quote }}
{{- end }}
{{- if and (ne .Values.database.mode "none") (not .Values.database.existingSecret) (not (and .Values.externalSecrets.enabled .Values.externalSecrets.databaseKey)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloud-devops.dbSecretName" . }}
  labels:
    {{- include "cloud-devops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.passwordKey }}: {{ required "database.password (or database.existingSecret / externalSecrets.databaseKey) is required" .Values.database.password | quote }}
{{- end }}
