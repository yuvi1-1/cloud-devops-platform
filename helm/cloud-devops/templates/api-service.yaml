{{- if .Values.api.enabled }}
{{- $c := dict "root" . "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-devops.api.fullname" . }}
  labels:
    {{- include "cloud-devops.componentLabels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cloud-devops.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.api.rollout.enabled }}
---
# Argo Rollouts narrows this Service's selector to the canary ReplicaSet during a rollout.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-devops.api.fullname" . }}-canary
  labels:
    {{- include "cloud-devops.componentLabels" $c | nindent 4 }}
    cloud-devops.io/role: canary
spec:
  type: ClusterIP
  selector:
    {{- include "cloud-devops.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
